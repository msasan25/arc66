<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arc 66</title>
<meta name="description" content="A personal 66-day habit program with quests, XP and streaks.">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arc 66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: single-column quest log, phone-first app shell with a fixed bottom tab bar; one deliberate dark "night HUD" world. */
:root{
  color-scheme: dark;
  --bg:#0f1220; --panel:#171b2e; --panel-2:#1f2440; --line:#2c3354; --fg:#ece9f7; --muted:#959cbd; --faint:#5f668a;
  --ember:#ffb347; --ember-2:#ff7a45; --ember-ink:#2a1606; --teal:#4fd1c5;
  --wisdom:#b794f6; --confidence:#63d3a0; --strength:#ff7b7b; --discipline:#63b3ed; --focus:#f6c453;
  --easy:#63d3a0; --medium:#f6c453; --hard:#ff7b7b;
  --good:#63d3a0; --warn:#f6c453; --bad:#ff7b7b;
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.label{font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font:600 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.hot{border-color:color-mix(in srgb,var(--ember-2) 60%,transparent);color:var(--ember);background:color-mix(in srgb,var(--ember-2) 14%,var(--panel))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg,.row > svg,.opt > svg{width:18px;height:18px;flex:none}
.btn.primary{background:linear-gradient(180deg,var(--ember),var(--ember-2));color:var(--ember-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:11px;background:var(--panel-2);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button .n{font-family:var(--f-mono);font-size:12px;opacity:.75;margin-left:4px}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--ember-2),var(--ember));border-radius:99px;transition:width .4s}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* Top HUD */
.hud{display:flex;align-items:center;gap:8px}
.hud .spacer{flex:1}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px}
.dayhead h1{font-size:44px;line-height:.95;font-weight:700}
.dayhead h1 small{font:600 20px var(--f-display);color:var(--faint)}
.daynav{display:flex;gap:8px}
.sub{color:var(--muted);margin-top:6px}

/* Quest cards */
.quests{display:flex;flex-direction:column;gap:10px}
.quest{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 14px 14px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;text-align:left;width:100%}
.quest::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--stat)}
.quest::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 0% 0%, color-mix(in srgb,var(--stat) 16%,transparent), transparent 55%);pointer-events:none}
.quest .body{min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.quest h3{font-size:20px;line-height:1.15;font-weight:700}
.quest .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.quest .meta b{color:var(--fg);font-weight:600}
.diff{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.diff i{width:8px;height:8px;border-radius:2px;background:currentColor}
.diff.easy{color:var(--easy)} .diff.medium{color:var(--medium)} .diff.hard{color:var(--hard)}
.qstreak{font:700 11.5px var(--f-mono);color:var(--ember);display:inline-flex;gap:4px;align-items:center}
.qstreak svg{width:12px;height:12px}
.quest .qbar{height:4px;border-radius:9px;background:var(--panel-2);overflow:hidden}
.quest .qbar i{display:block;height:100%;background:var(--stat)}
.check{position:relative;z-index:1;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--bg)}
.check svg{width:22px;height:22px;opacity:.35}
.quest.done{opacity:.78}
.quest.done .check{background:var(--stat);border-color:var(--stat);color:var(--bg)}
.quest.done .check svg{opacity:1}
.quest.done h3{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--fg) 40%,transparent)}
.quest.skipped{opacity:.55}
.remind{font:600 11.5px var(--f-mono);color:var(--teal)}
.remind.due{color:var(--ember)}

/* Card of the day */
.mcard{position:relative;border-radius:var(--r);padding:16px;border:1px solid color-mix(in srgb,var(--cc) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 18%,var(--panel)),var(--panel) 70%);overflow:hidden}
.mcard .q{font:600 19px/1.3 var(--f-display);margin:6px 0 12px}
.mcard .cat{color:var(--cc)}

/* Tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:11.5px;font-weight:600;color:var(--faint)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ember)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,6,14,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(92% - env(safe-area-inset-top, 0px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet .grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 2px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center}
.stepper .val{font:700 38px var(--f-mono);min-width:150px;text-align:center}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 12%,var(--bg))}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{min-height:40px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.days7 button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Celebration */
.celebrate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,122,69,.28),rgba(5,6,14,.92) 60%);padding:24px}
.celebrate .box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:360px}
.celebrate h2{font-size:40px;line-height:1;color:var(--ember)}
.flame{width:110px;height:110px;color:var(--ember-2);filter:drop-shadow(0 0 24px rgba(255,122,69,.7));animation:flare 1.1s ease-out}
@keyframes flare{0%{transform:scale(.3) translateY(30px);opacity:0}55%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.loot{padding:12px 16px;border-radius:12px;border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--panel));width:100%}
.loot .rar{font:700 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Insight */
.levelcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lvl{width:84px;height:84px;border-radius:16px;background:linear-gradient(160deg,var(--ember),var(--ember-2));color:var(--ember-ink);display:grid;place-items:center;text-align:center}
.lvl b{font:700 36px/1 var(--f-display);display:block}
.lvl span{font:700 10px var(--f-mono);letter-spacing:.14em}
.stat{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat svg{width:18px;height:18px;color:var(--c)}
.stat .nm{font:600 12px var(--f-body);letter-spacing:.16em;text-transform:uppercase}
.stat .v{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.stat .d{font:600 12px var(--f-mono);color:var(--good);margin-right:6px}
.classbadge{font:700 30px/1 var(--f-display);letter-spacing:.04em}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ach div{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg)}
.ach div.on{border-color:color-mix(in srgb,var(--ember) 55%,var(--line));background:color-mix(in srgb,var(--ember) 10%,var(--panel))}
.ach b{font-size:12.5px;line-height:1.25}
.ach span{font-size:11px;color:var(--muted);line-height:1.3}
.ach div:not(.on) b{color:var(--faint)}
.tier{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tier .gem{width:58px;height:58px}
.inv{display:flex;flex-direction:column;gap:6px}
.inv div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--bg);border-left:3px solid var(--rc)}

/* Program */
.cal{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:7px;font:600 10.5px var(--f-mono);color:var(--muted);background:var(--bg);border:1px solid var(--line)}
.cal .cleared{background:color-mix(in srgb,var(--ember-2) 70%,var(--bg));color:var(--ember-ink);border-color:transparent}
.cal .partial{background:color-mix(in srgb,var(--ember) 22%,var(--bg));color:var(--fg)}
.cal .missed{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.cal .rest{background:repeating-linear-gradient(45deg,var(--panel-2) 0 3px,var(--bg) 3px 6px)}
.cal .today{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit .dot{width:10px;height:10px;border-radius:3px;background:var(--stat)}
.habit .t{min-width:0}
.habit .t b{display:block;overflow-wrap:anywhere}
.habit .t span{font-size:12.5px;color:var(--muted)}
.habit .acts{display:flex;gap:4px}
.habit .acts button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line)}
.habit .acts svg{width:15px;height:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ember-2);border-color:var(--ember-2)}
.switch[aria-checked="true"]::after{left:23px;background:#fff}

/* Tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);min-height:128px}
.tool .ti{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 18%,var(--bg));color:var(--tc)}
.tool .ti svg{width:20px;height:20px}
.tool b{font-family:var(--f-display);font-size:17px}
.tool span{font-size:12.5px;color:var(--muted);line-height:1.35}
.toolhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.toolhead h1{font-size:28px}
.timer{font:700 64px/1 var(--f-mono);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring{position:relative;width:220px;height:220px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.breath{width:200px;height:200px;margin:10px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--teal) 40%,transparent),color-mix(in srgb,var(--teal) 6%,transparent) 70%);border:1px solid color-mix(in srgb,var(--teal) 50%,transparent);transition:transform linear}
.breath b{font:600 18px var(--f-display)}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.moods{display:flex;gap:6px}
.moods button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);font:700 13px var(--f-mono)}
.moods button[aria-pressed="true"]{background:var(--teal);color:var(--bg);border-color:var(--teal)}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center}
.setrow input{min-height:38px;padding:7px 9px}
.food{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.food small{color:var(--muted)}
.ring-k{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macro div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.macro b{font:700 17px var(--f-mono);display:block}
.ideas{display:flex;flex-direction:column;gap:12px}
.ideas div{padding-left:12px;border-left:2px solid var(--wisdom)}
.ideas p{margin:4px 0 0;color:var(--muted)}
.chart text{fill:var(--muted);font:600 10px var(--f-mono)}

/* Onboarding */
.ob{min-height:calc(100% - 40px);display:flex;flex-direction:column;gap:18px;padding-top:12px}
.ob h1{font-size:34px;line-height:1.05}
.ob .hero{font:700 56px/0.9 var(--f-display);letter-spacing:-.01em}
.ob .hero em{font-style:normal;color:var(--ember)}
.ob .steps{display:flex;gap:4px}
.ob .steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.ob .steps i.on{background:var(--ember)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .opt{flex-direction:column;align-items:flex-start;gap:2px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ember);animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font:600 12px var(--f-body);background:var(--panel-2);border:1px solid var(--line)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
@media (max-width:440px){.ring-k{grid-template-columns:1fr}.ring-k > .ring{margin:0 auto!important}}
@media (max-width:380px){.dayhead h1{font-size:38px}.pick{grid-template-columns:1fr}.cal{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>
<div class="app" id="app"><p class="muted" style="padding-top:40vh;text-align:center">Loading your quest log…</p></div>
<div id="layer"></div>
<div class="tabbar" id="tabbar" hidden><nav>
  <button data-act="tab" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Today</button>

  const span = Math.max(0, diffDays(start, today));
  for (let i = 0; i <= span; i++){
    const k = addDays(start, i);
    let gain = 0, done = 0;
    const ts = scheduled(k);
    for (const t of ts){ if (isDone(k,t)) { done++; gain += DIFF_XP[t.diff] || 10; stats[t.stat] = (stats[t.stat] || 0) + (DIFF_PTS[t.diff] || 2); } }
    const status = dayStatus(k);
    if (status === "cleared") { streak++; cleared++; gain += 25 + 5 * Math.min(streak, 10); }
    else if (k < today && (status === "missed" || status === "partial")) { if (hardOn(k)) { gain -= 60; hardMissDays++; } streak = 0; }
    best = Math.max(best, streak);
    // tool bonuses
    gain += Math.min(60, (s.focusLog && s.focusLog[k]) || 0) + Math.min(30, (s.medLog && s.medLog[k]) || 0) + Math.min(30, (s.phoneLog && s.phoneLog[k]) || 0);
    if (S.journal.entries.some(e => e.date === k)) gain += 10;
    if (S.fit.workouts.some(w => w.date === k)) gain += 30;
    xp = Math.max(0, xp + gain);
    totalDone += done;
    if (k.slice(0,7) === month) seasonXp += Math.max(0, gain);

  memo = {xp, level, cur, next, stats, base, streak, best, totalDone, cleared, perDay, series, klass, top, seasonXp, tierIdx: ti, hardMissDays};

}
function lootFor(k){

function taskStreak(t, upto){
  let n = 0, k = upto;

}

function setProgress(k, t, value){

  if (s.log[k].s) delete s.log[k].s[t.id];

}
function creditTool(kind, minutes){

  s[field] = s[field] || {}; s[field][k] = (s[field][k] || 0) + minutes;

}

}

/* ---------- onboarding ---------- */
function renderOnboarding(){
  const o = S.ui.ob, a = o.a;
  const steps = 6;
  const bar = `<div class="steps">${Array.from({length: steps}, (_, i) => `<i class="${i <= o.step ? "on" : ""}"></i>`).join("")}</div>`;
  const nav = (ok = true, label = "Continue") => `<div class="row" style="margin-top:auto">${o.step > 0 ? `<button class="btn" data-act="ob-back">Back</button>` : ""}<button class="btn primary" style="flex:1" data-act="ob-next" ${ok ? "" : "disabled"}>${label}</button></div>`;
  if (o.step === 0) return `<div class="ob">
    <div class="hero">TURN 66 DAYS<br>INTO A <em>CAMPAIGN</em></div>
    <p class="muted" style="margin:0;font-size:16px">A few questions about your life and goals, then a personal assessment and a 66-day quest plan you can change any time.</p>
    <div class="panel stack" style="gap:8px"><div class="row">${I.check}<span>Daily quests with XP, levels and streaks</span></div><div class="row">${I.check}<span>Five stats: Wisdom, Confidence, Strength, Discipline, Focus</span></div><div class="row">${I.check}<span>Seven tools: focus, meditation, journal, workouts, calories, reading, phone-down</span></div><div class="row">${I.check}<span>Works offline. Your data never leaves this phone.</span></div></div>
    <div class="field"><label class="label" for="ob-name">What should I call you?</label><input type="text" id="ob-name" value="${esc(a.name)}" placeholder="Your name" data-ob="name"></div>
    ${nav(true, "Start")}</div>`;
  if (o.step === 1) return `<div class="ob">${bar}<h1>What do you want to level up?</h1><p class="muted" style="margin:0">Pick up to four.</p>
    <div class="pick">${AREAS.map(([id,n,d]) => `<button class="opt" aria-pressed="${a.areas.includes(id)}" data-act="ob-area" data-v="${id}"><b>${n}</b><span>${d}</span></button>`).join("")}</div>${nav(a.areas.length > 0)}</div>`;
  if (o.step === 2) return `<div class="ob">${bar}<h1>Where are you starting from?</h1>
    ${slider("sleep","Sleep per night", a.sleep, 3, 10, "h")}
    ${slider("screen","Phone screen time per day", a.screen, 0, 12, "h")}
    ${slider("exercise","Workouts per week", a.exercise, 0, 7, "")}
    ${nav()}</div>`;
  if (o.step === 3) return `<div class="ob">${bar}<h1>What usually gets in the way?</h1>
    <div class="stack" style="gap:8px">${OBSTACLES.map(([id,n]) => `<button class="opt" aria-pressed="${a.obstacle === id}" data-act="ob-obs" data-v="${id}"><b>${n}</b></button>`).join("")}</div>${nav(!!a.obstacle)}</div>`;
  if (o.step === 4) return `<div class="ob">${bar}<h1>How hard should it push?</h1>
    <div class="stack" style="gap:8px">${[["gentle","Gentle","3–4 easy quests a day"],["balanced","Balanced","5–6 quests, mixed difficulty"],["intense","Intense","7–8 quests, more hard ones"]].map(([id,n,d]) => `<button class="opt" aria-pressed="${a.intensity === id}" data-act="ob-int" data-v="${id}"><span><b>${n}</b><span>${d}</span></span></button>`).join("")}</div>
    <div class="panel toggle"><div><b>Hard Mode</b><div class="note">Skips don't count and missed days cost XP.</div></div><button class="switch" role="switch" aria-checked="${a.hard}" data-act="ob-hard" aria-label="Hard Mode"></button></div>
    <div class="field"><span class="label">Rest days</span><div class="days7">${WD.map((d,i) => `<button aria-pressed="${a.rest.includes(i)}" data-act="ob-rest" data-v="${i}">${d}</button>`).join("")}</div></div>
    ${nav(true, "Build my program")}</div>`;
  if (o.step === 5) {
    if (o.loading) return `<div class="ob">${bar}<h1>Reading your answers…</h1><div class="spin"></div><p class="muted" style="text-align:center;margin:0">${o.loadingMsg || ""}</p></div>`;
    const r = o.result; if (!r) return `<div class="ob">${bar}<div class="spin"></div></div>`;
    return `<div class="ob">${bar}
      <div><div class="label">Your class</div><div class="classbadge" style="font-size:40px;margin-top:4px">${esc(r.className.toUpperCase())}</div></div>
      <p style="margin:0">${esc(r.summary)}</p>
      <div class="grid2"><div class="panel"><div class="label">Strengths</div><ul class="clean" style="margin-top:6px">${r.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div class="panel"><div class="label">Blind spots</div><ul class="clean" style="margin-top:6px">${r.blindSpots.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
      ${r.focusFirst ? `<div class="panel"><div class="label">Focus first</div><p style="margin:6px 0 0">${esc(r.focusFirst)}</p></div>` : ""}
      <div class="panel">${STATS.map(x => `<div class="stat" style="--c:var(--${x})">${I[x]}<span class="nm">${STAT_NAME[x]}</span><span class="v">${r.base[x]}</span></div>`).join("")}</div>
      <h2 style="font-size:22px">Your 66-day quests</h2><p class="note" style="margin:-8px 0 0">Untick anything that doesn't fit. You can edit all of it later.</p>
      <div class="stack" style="gap:8px">${r.tasks.map((t,i) => `<button class="opt" aria-pressed="${!t.off}" data-act="ob-task" data-v="${i}" style="border-left:4px solid var(--${t.stat})"><span style="min-width:0"><b>${esc(t.title)}</b><span>${freqLabel(t.days)} · ${t.diff} · ${STAT_NAME[t.stat]}${t.why ? ` — ${esc(t.why)}` : ""}</span></span></button>`).join("")}</div>
      ${o.note ? `<p class="note">${esc(o.note)}</p>` : ""}
      <div class="row"><button class="btn" data-act="ob-back">Back</button><button class="btn primary" style="flex:1" data-act="ob-finish" ${r.tasks.some(t => !t.off) ? "" : "disabled"}>Start day 1</button></div></div>`;
  }
  return "";
}
function slider(id, label, v, min, max, unit){
  return `<div class="field"><div class="row between"><label class="label" for="ob-${id}">${label}</label><b class="mono" id="ob-${id}-v">${v}${unit}</b></div><input type="range" id="ob-${id}" min="${min}" max="${max}" value="${v}" data-ob="${id}" data-unit="${unit}" style="accent-color:var(--ember)"></div>`;
}
function fallbackProgram(a){
  const n = {gentle:4, balanced:6, intense:8}[a.intensity];
  const pool = [];
  const areas = a.areas.length ? a.areas : ["discipline","fitness","mind"];
  const lists = areas.map(x => LIB[x].slice());
  if (a.obstacle === "phone" && !areas.includes("focus")) lists.push([LIB.focus[1]]);
  while (pool.length < n && lists.some(l => l.length)) for (const l of lists) { if (l.length && pool.length < n) pool.push(l.shift()); }
  const tasks = pool.map(t => ({...t, days: t.days || [0,1,2,3,4,5,6], diff: a.intensity === "gentle" && t.diff === "hard" ? "medium" : t.diff}));
  const base = {wisdom: 22, confidence: 22, strength: 18 + a.exercise*5, discipline: 20, focus: Math.max(10, 40 - a.screen*3)};
  if (a.sleep >= 7) base.discipline += 8; else base.discipline -= 4;
  const top = STATS.slice().sort((x,y) => base[y] - base[x])[0];
  return {
    className: CLASS_OF[top], base,
    summary: `You're starting with ${a.exercise} workouts a week, about ${a.sleep} hours of sleep and ${a.screen} hours on your phone a day. The plan leans on ${areas.map(x => AREAS.find(y => y[0] === x)[1].toLowerCase()).join(", ")}.`,
    strengths: [`${STAT_NAME[top]} is your strongest stat today`, a.exercise >= 3 ? "You already train regularly" : "You chose to start, which most people never do"],
    blindSpots: [a.screen >= 4 ? "Phone time is taking hours from your day" : "Consistency on low-energy days", a.sleep < 7 ? "Short sleep will drain your willpower" : `Your obstacle: ${OBSTACLES.find(x => x[0] === a.obstacle)[1].toLowerCase()}`],
    focusFirst: a.obstacle === "forget" ? "Attach each quest to a fixed time. Use reminders on the quests." : a.obstacle === "phone" ? "Use Phone Down for the first hour of your evening." : "Do the easiest quest first every morning to start the chain.",
    tasks,
  };
}
function buildProgram(){
  const o = S.ui.ob;
  o.loading = true; o.loadingMsg = "Building your assessment and program."; render();
  setTimeout(() => { o.result = fallbackProgram(o.a); o.loading = false; render(); }, 900);
}
function finishOnboarding(){
  const o = S.ui.ob, a = o.a, r = o.result;
  const k = todayKey();
  S.state = {
    v: 1, createdAt: Date.now(), name: a.name, start: k, length: 66,
    hardMode: a.hard, hardFrom: a.hard ? k : null, restDays: a.rest.slice(), units: "kg", lang: "English",
    assessment: {className: r.className, summary: r.summary, strengths: r.strengths, blindSpots: r.blindSpots, focusFirst: r.focusFirst, base: r.base},
    tasks: r.tasks.filter(t => !t.off).map(t => ({id: uid(), title: t.title, stat: t.stat, diff: t.diff, target: t.target, unit: t.unit, days: t.days, from: k, why: t.why || "", remind: null})),
    log: {}, cards: [], runs: [], focusLog: {}, medLog: {}, phoneLog: {}, bedtime: null,
  };
  save("state"); save("journal"); save("fit"); save("books");
  S.ui.tab = "today"; S.ui.view = k; render();
}

/* ---------- tools ---------- */
function renderTool(){
  const id = S.ui.tool;
  const head = (title) => `<div class="toolhead"><button class="icon-btn" data-act="tool-close" aria-label="Back">${I.back}</button><h1>${title}</h1></div>`;
  if (id === "focus") return head("Focus Timer") + timerTool("focus", [15,25,45,60], "Each finished session adds focus minutes, XP, and progress on focus-session quests.");
  if (id === "med") return head("Meditation") + medTool();
  if (id === "phone") return head("Phone Down") + timerTool("phone", [15,30,60,120], "Put the phone face down and leave this page open. If you switch away from it, the session fails. It can't block other apps; it holds you to your word.");
  if (id === "journal") return head("Journal") + journalTool();
  if (id === "workout") return head("Workout Tracker") + workoutTool();
  if (id === "food") return head("Calorie Tracker") + foodTool();
  if (id === "books") return head("Reading Log") + booksTool();
  return "";
}
function timerTool(kind, presets, note){
  const t = S.timer && S.timer.kind === kind ? S.timer : null;
  const sel = S.ui.timerMins || presets[1];
  const total = t ? t.mins * 60 : sel * 60;
  return `<div class="stack">
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--panel-2)" stroke-width="6"/><circle cx="50" cy="50" r="45" fill="none" stroke="${kind === "phone" ? "var(--discipline)" : "var(--focus)"}" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="${t ? 0 : 282.7}" data-tick="ring"/></svg>
      <div class="in"><div><div class="timer" data-tick="clock" style="font-size:46px">${t ? "" : `${pad(sel)}:00`}</div><div class="label" style="margin-top:6px">${t ? (kind === "phone" ? "phone down" : "focusing") : "ready"}</div></div></div></div>
    ${t ? `<button class="btn block" data-act="timer-stop">Give up</button>` : `<div class="seg" style="justify-content:center">${presets.map(m => `<button aria-pressed="${sel === m}" data-act="tmins" data-v="${m}">${m < 60 ? m + " min" : m/60 + " h"}</button>`).join("")}</div><button class="btn primary block" data-act="timer-start" data-v="${kind}">Start ${kind === "phone" ? "phone-down" : "focus"} session</button>`}
    <p class="note" style="text-align:center">${note}</p>
    <div class="panel"><div class="label">Today</div><b class="mono" style="font-size:22px">${(st()[kind === "phone" ? "phoneLog" : "focusLog"] || {})[todayKey()] || 0} min</b></div>
  </div>`;
}
const PATTERNS = {box:{name:"Box 4-4-4-4",seq:[["Breathe in",4,1.25],["Hold",4,1.25],["Breathe out",4,.8],["Hold",4,.8]]},calm:{name:"Calm 4-7-8",seq:[["Breathe in",4,1.25],["Hold",7,1.25],["Breathe out",8,.8]]},even:{name:"Even 5-5",seq:[["Breathe in",5,1.25],["Breathe out",5,.8]]}};
function medTool(){
  const t = S.timer && S.timer.kind === "med" ? S.timer : null;
  const pat = S.ui.medPat || "box", mins = S.ui.medMins || 5;
  return `<div class="stack">
    <div class="breath" data-tick="breath"><b data-tick="phase">${t ? "" : "Ready"}</b></div>

}
const PROMPTS = ["What went well today, and why?","What's one thing you avoided? What made it hard?","Who did you help or connect with today?","What would make tomorrow a win?","What are you proud of this week?","What drained your energy today?","What did you learn about yourself today?"];
function journalTool(){
  const k = todayKey();
  const draft = S.ui.jDraft || {mood: 3, text: ""};

  const entries = S.journal.entries.slice().sort((a,b) => b.ts - a.ts);
  return `<div class="stack">
    <div class="panel stack">
      <div class="label">Today's prompt</div><b>${esc(prompt)}</b>
      <div class="field"><span class="label">Mood</span><div class="moods">${[1,2,3,4,5].map(m => `<button aria-pressed="${draft.mood === m}" data-act="jmood" data-v="${m}">${["Low","Meh","Okay","Good","Great"][m-1]}</button>`).join("")}</div></div>

  </div>`;
}
function workoutTool(){
  const f = S.fit, live = S.ui.wo, u = st().units;
  if (live) {
    const vol = live.moves.reduce((a,m) => a + m.sets.reduce((b,s) => b + (Number(s.r)||0)*(Number(s.w)||0), 0), 0);
    return `<div class="stack">
      <div class="panel row between"><div><div class="label">In progress</div><b style="font:700 22px var(--f-display)">${esc(live.name)}</b></div><span class="mono" data-tick="wo" style="font-size:20px"></span></div>
      ${live.moves.map((m,mi) => `<div class="panel stack" style="gap:8px"><div class="row between"><input type="text" value="${esc(m.name)}" data-wo="name" data-m="${mi}" aria-label="Exercise name" style="font-weight:700"><button class="icon-btn" data-act="wo-delmove" data-v="${mi}" aria-label="Remove exercise">${I.trash}</button></div>
        <div class="setrow note"><span>#</span><span>Reps</span><span>Weight (${u})</span><span></span></div>
        ${m.sets.map((s,si) => `<div class="setrow"><span class="mono muted">${si+1}</span><input type="number" inputmode="numeric" value="${esc(s.r)}" data-wo="r" data-m="${mi}" data-s="${si}" aria-label="Reps"><input type="number" inputmode="decimal" value="${esc(s.w)}" data-wo="w" data-m="${mi}" data-s="${si}" aria-label="Weight"><button class="check" style="width:34px;height:34px;${s.ok ? "background:var(--strength);border-color:var(--strength);color:var(--bg)" : ""}" data-act="wo-ok" data-m="${mi}" data-s="${si}" aria-label="Set done">${I.check}</button></div>`).join("")}
        <button class="btn small ghost" data-act="wo-addset" data-v="${mi}">${I.plus} Add set</button></div>`).join("")}
      <button class="btn" data-act="wo-addmove">${I.plus} Add exercise</button>
      <div class="row"><button class="btn" data-act="wo-cancel">Discard</button><button class="btn primary" style="flex:1" data-act="wo-finish">Finish · ${fmt(vol)} ${u}</button></div>
    </div>`;
  }
  const recent = f.workouts.slice().sort((a,b) => b.ts - a.ts);
  return `<div class="stack">
    <div class="label">Quick start</div>

    <div class="section"><h2 style="font-size:20px">Recent</h2><div class="panel" style="padding-block:4px">${recent.map(w => `<div class="food"><div><b>${esc(w.name)}</b><br><small>${parseKey(w.date).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})} · ${w.sets} sets · ${w.mins} min</small></div><span class="mono">${fmt(w.volume)} ${esc(w.units || u)}</span></div>`).join("") || `<p class="note">Finished workouts show here. Each one is worth 30 XP.</p>`}</div></div>
  </div>`;
}
function foodTool(){
  const f = S.fit, k = todayKey();
  const today = f.foods.filter(x => x.date === k);
  const sum = today.reduce((a,x) => ({kcal: a.kcal + x.kcal, p: a.p + (x.protein||0), c: a.c + (x.carbs||0), f: a.f + (x.fat||0)}), {kcal:0,p:0,c:0,f:0});
  const pct = Math.min(1, sum.kcal / (f.kcalGoal || 2200));

/* ---------- timers ---------- */
let wakeLock = null, lastPhase = "";
function startTimer(kind){
  const mins = kind === "med" ? (S.ui.medMins || 5) : (S.ui.timerMins || (kind === "phone" ? 30 : 25));
  S.timer = {kind, mins, startedAt: Date.now(), endAt: Date.now() + mins*60e3, pat: S.ui.medPat || "box"};
  lsSet("arc66.timer", S.timer);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wakeLock = w).catch(() => {}); } catch {}
  render();
}
function stopTimer(completed){
  const t = S.timer; if (!t) return;
  S.timer = null; lsDel("arc66.timer");
  try { wakeLock && wakeLock.release(); } catch {} wakeLock = null;
  try { speechSynthesis.cancel(); } catch {}
  if (completed) { creditTool(t.kind, t.mins); toast(`Session complete. +${Math.min(t.mins, 60)} XP`); }
  else {
    const done = Math.floor((Date.now() - t.startedAt) / 60e3);
    if (t.kind === "med" && done >= 1) { creditTool("med", done); toast(`${done} min logged.`); }
    else toast(t.kind === "phone" ? "Session ended early." : "Session stopped.");
  }
  render();
}
function say(text){ if (!S.ui.voice) return; try { const u = new SpeechSynthesisUtterance(text); u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {} }
function tick(){
  const t = S.timer;
  const bed = document.querySelector('[data-tick="bed"]'); if (bed && st() && st().bedtime) bed.textContent = bedCountdown(st().bedtime);
  const wo = document.querySelector('[data-tick="wo"]'); if (wo && S.ui.wo) { const s = Math.floor((Date.now() - S.ui.wo.startedAt)/1000); wo.textContent = `${Math.floor(s/60)}:${pad(s%60)}`; }
  if (!t) return;
  const left = Math.max(0, t.endAt - Date.now());
  const mm = Math.floor(left/60e3), ss = Math.floor(left%60e3/1000);
  const txt = `${pad(mm)}:${pad(ss)}`;
  document.querySelectorAll('[data-tick="clock"],[data-tick="mini"]').forEach(e => e.textContent = txt);
  const ring = document.querySelector('[data-tick="ring"]'); if (ring) ring.setAttribute("stroke-dashoffset", (282.7 * (1 - left / (t.mins*60e3))).toFixed(1));
  if (t.kind === "med") {
    const p = PATTERNS[t.pat] || PATTERNS.box; const cyc = p.seq.reduce((a,x) => a + x[1], 0);
    let el = ((Date.now() - t.startedAt) / 1000) % cyc, i = 0; while (el >= p.seq[i][1]) { el -= p.seq[i][1]; i++; }
    const [name, dur, scale] = p.seq[i];
    const ph = document.querySelector('[data-tick="phase"]'); if (ph) ph.textContent = `${name} · ${Math.ceil(dur - el)}`;
    const br = document.querySelector('[data-tick="breath"]'); if (br && br.dataset.ph !== name + i) { br.dataset.ph = name + i; br.style.transitionDuration = dur + "s"; br.style.transform = `scale(${scale})`; }
    if (lastPhase !== name + i) { lastPhase = name + i; say(name); }
  }
  if (left <= 0) stopTimer(true);
}
setInterval(tick, 500);
document.addEventListener("visibilitychange", () => { if (document.hidden && S.timer && S.timer.kind === "phone") { S.timer = null; lsDel("arc66.timer"); S.ui.phoneFailed = true; } else if (!document.hidden && S.ui.phoneFailed) { S.ui.phoneFailed = false; toast("You left the page, so the Phone Down session ended."); render(); } });

      if (S.ui.sheet.isNew) s.tasks.push({...d, id: uid(), from: todayKey()}); else { const i = s.tasks.findIndex(x => x.id === S.ui.sheet.id); s.tasks[i] = {...s.tasks[i], ...d}; }
      save("state"); S.ui.sheet = null; toast("Quest saved."); },
    "e-del"(){ const id = S.ui.sheet.id; S.ui.sheet = {type: "confirm", title: "Remove this quest?", body: "It disappears from today onward. Days you already completed keep their history and XP.", yes: "Remove", run: () => { const t = s.tasks.find(x => x.id === id); t.until = todayKey(); if (t.from >= t.until) s.tasks = s.tasks.filter(x => x.id !== id); save("state"); toast("Quest removed."); }}; },
    "confirm-yes"(){ const r = S.ui.sheet.run; S.ui.sheet = null; r(); },
    mv(){ const active = s.tasks.filter(t => !t.until); const i = active.findIndex(t => t.id === v), j = i + Number(el.dataset.d); if (j < 0 || j >= active.length) return; const a = s.tasks.indexOf(active[i]), b = s.tasks.indexOf(active[j]); [s.tasks[a], s.tasks[b]] = [s.tasks[b], s.tasks[a]]; save("state"); },
    rest(){ const n = Number(v); s.restDays = s.restDays.includes(n) ? s.restDays.filter(x => x !== n) : [...s.restDays, n]; if (s.restDays.length > 3) { s.restDays.shift(); toast("Up to 3 rest days a week."); } save("state"); },
    hard(){ s.hardMode = !s.hardMode; s.hardFrom = s.hardMode ? todayKey() : null; save("state"); toast(s.hardMode ? "Hard Mode on from today." : "Hard Mode off."); },
    extend(){ s.length += 30; save("state"); toast(`Program extended to ${s.length} days.`); },
    restart(){ S.ui.sheet = {type: "confirm", title: "Start a new 66-day arc?", body: "Day 1 becomes today. Your quests, XP, stats, loot and history carry over.", yes: "Start new arc", run: () => { const c = computeAll(); s.runs = s.runs || []; s.runs.push({start: s.start, end: todayKey(), length: s.length, cleared: c.cleared}); s.start = todayKey(); s.length = 66; s.tasks.forEach(t => { if (!t.until && t.from > s.start) t.from = s.start; }); save("state"); S.ui.view = todayKey(); toast("New arc started."); }}; },
    export(){ exportData(); },
    "reset-yes"(){ for (const n of Object.keys(DOCS)) { lsDel("arc66." + n); } S.state = null; S.journal = {entries: []}; S.fit = {workouts: [], foods: [], kcalGoal: 2200, proteinGoal: 120, recent: []}; S.books = {items: [], log: {}}; S.ui.sheet = null; S.ui.ob.step = 0; },
    stuck(){ S.ui.sheet = {type: "stuck", id: v || null}; },
    "stuck-pick"(){ S.ui.sheet = {type: "stuck", id: v}; },
    "stuck-why"(){ S.ui.sheet.why = v; },
    "stuck-when"(){ S.ui.sheet.when = v; S.ui.sheet.time = el.dataset.t; },
    "stuck-apply"(){ const sh = S.ui.sheet, t = s.tasks.find(x => x.id === sh.id), fix = stuckFix(t, sh.why, sh.when, sh.time); S.ui.sheet = null;
      if (fix.kind === "remind") { t.remind = sh.time; toast(`Set for ${sh.time}.`); }
      else if (fix.kind === "move") { t.remind = "07:30"; toast("Moved to 07:30."); }
      else if (fix.kind === "shrink") { t.target = Math.max(1, Math.round(t.target/2*100)/100); if (t.diff === "hard") t.diff = "medium"; else if (t.diff === "medium") t.diff = "easy"; toast("Target halved."); }
      else if (fix.kind === "bed") { s.bedtime = "23:00"; toast("Bedtime countdown on."); }
      else if (fix.kind === "phone") { S.ui.tool = "phone"; S.ui.timerMins = 30; }
      else if (fix.kind === "focus") { S.ui.tool = "focus"; S.ui.timerMins = 15; }
      save("state"); },
    tool(){ S.ui.tool = v; S.ui.timerMins = null; S.ui.bookOpen = null; window.scrollTo(0,0); },
    "tool-close"(){ S.ui.tool = null; S.ui.tab = "tools"; },
    tmins(){ S.ui.timerMins = Number(v); },
    "timer-start"(){ startTimer(v); return true; },
    "timer-stop"(){ stopTimer(false); return true; },
    medpat(){ S.ui.medPat = v; }, medmins(){ S.ui.medMins = Number(v); }, voice(){ S.ui.voice = !S.ui.voice; },
    jmood(){ S.ui.jDraft = {text: ($("#jtext") || {}).value || "", mood: Number(v)}; },
    jsave(){ const text = ($("#jtext").value || "").trim(); if (!text) { toast("Write something first."); return; } S.journal.entries.push({id: uid(), date: todayKey(), ts: Date.now(), mood: (S.ui.jDraft && S.ui.jDraft.mood) || 3, text}); S.ui.jDraft = null; save("journal"); memo = null;
      for (const t of scheduled(todayKey())) if (/journal/i.test(t.title) && !isDone(todayKey(), t)) setProgress(todayKey(), t, t.target); toast("Entry saved. +10 XP today."); },
    jdel(){ const id = v; S.ui.sheet = {type: "confirm", title: "Delete this entry?", body: "It can't be recovered afterward.", yes: "Delete", run: () => { S.journal.entries = S.journal.entries.filter(x => x.id !== id); save("journal"); }}; },
    "wo-start"(){ S.ui.wo = {name: v ? `${v} Day` : "Session", startedAt: Date.now(), moves: (WORKOUT_TPL[v] || [["Exercise",3,10]]).map(([n,sets,r]) => ({name: n, sets: Array.from({length: sets}, () => ({r, w: "", ok: false}))}))}; lsSet("arc66.wo", S.ui.wo); },
    "wo-addset"(){ readWo(); const m = S.ui.wo.moves[Number(v)]; const last = m.sets[m.sets.length-1] || {r: 10, w: ""}; m.sets.push({r: last.r, w: last.w, ok: false}); lsSet("arc66.wo", S.ui.wo); },
    "wo-addmove"(){ readWo(); S.ui.wo.moves.push({name: "Exercise", sets: [{r: 10, w: "", ok: false}]}); lsSet("arc66.wo", S.ui.wo); },
    "wo-delmove"(){ readWo(); S.ui.wo.moves.splice(Number(v), 1); lsSet("arc66.wo", S.ui.wo); },
    "wo-ok"(){ readWo(); const st_ = S.ui.wo.moves[Number(el.dataset.m)].sets[Number(el.dataset.s)]; st_.ok = !st_.ok; lsSet("arc66.wo", S.ui.wo); },
    "wo-cancel"(){ S.ui.wo = null; lsDel("arc66.wo"); },
    "wo-finish"(){ readWo(); const w = S.ui.wo; const sets = w.moves.reduce((a,m) => a + m.sets.length, 0); const volume = w.moves.reduce((a,m) => a + m.sets.reduce((b,x) => b + (Number(x.r)||0)*(Number(x.w)||0), 0), 0);
      S.fit.workouts.push({id: uid(), date: todayKey(), ts: Date.now(), name: w.name, mins: Math.max(1, Math.round((Date.now() - w.startedAt)/60e3)), sets, volume, units: s.units, moves: w.moves.map(m => ({name: m.name, sets: m.sets.map(x => ({r: Number(x.r)||0, w: Number(x.w)||0}))}))});
      S.fit.workouts = S.fit.workouts.slice(-300); S.ui.wo = null; lsDel("arc66.wo"); save("fit"); memo = null;
      for (const t of scheduled(todayKey())) if (/workout|train|gym|lift/i.test(t.title) && !isDone(todayKey(), t)) setProgress(todayKey(), t, t.unit === "min" ? prog(todayKey(), t) + Math.round((Date.now() - w.startedAt)/60e3) : t.target);
      toast("Workout saved. +30 XP."); },
    "food-add"(){ const name = $("#fname").value.trim(), kcal = Number($("#fkcal").value), protein = Number($("#fprot").value) || 0; if (!name || !kcal) { toast("Add a name and calories."); return; } logFood({name, kcal, protein}); },
    "food-relog"(){ logFood({...S.fit.recent[Number(v)]}); },
    "food-del"(){ S.fit.foods = S.fit.foods.filter(x => x.id !== v); save("fit"); },
    "food-pick"(){ const f = FOODS[Number(v)]; logFood({name: f[0], portion: f[1], kcal: f[2], protein: f[3], carbs: f[4], fat: f[5]}); },
    "book-add"(){ const title = $("#btitle").value.trim(); if (!title) { toast("Add a title."); return; } S.books.items.push({id: uid(), title, author: $("#bauthor").value.trim(), pages: Number($("#btotal").value) || 0, read: 0, notes: "", startedAt: todayKey(), finishedAt: null}); save("books"); toast("Book added."); },
    "book-open"(){ S.ui.bookOpen = v; window.scrollTo(0,0); },
    "book-close"(){ S.ui.bookOpen = null; },
    "book-log"(){ const n = Math.round(Number($("#bpages").value)); if (!n || n < 1) { toast("Enter how many pages you read."); return; } const b = S.books.items.find(x => x.id === v); b.read += n; if (b.pages && b.read >= b.pages && !b.finishedAt) { b.finishedAt = todayKey(); toast("Book finished. Nice."); } else toast(`${n} pages logged.`); creditReading(n); save("books"); },
    "book-note"(){ const b = S.books.items.find(x => x.id === v); b.notes = $("#bnote").value; save("books"); toast("Takeaways saved."); },
    "book-finish"(){ const b = S.books.items.find(x => x.id === v); b.finishedAt = b.finishedAt ? null : todayKey(); save("books"); },
    "book-del"(){ const id = v; S.ui.sheet = {type: "confirm", title: "Remove this book?", body: "Its takeaways are deleted too. Pages you logged still count.", yes: "Remove", run: () => { S.books.items = S.books.items.filter(x => x.id !== id); S.ui.bookOpen = null; save("books"); }}; },
    "ob-next"(){ readOb(); const o = S.ui.ob; o.step++; if (o.step === 5) { buildProgram(); return true; } },
    "ob-back"(){ readOb(); S.ui.ob.step = Math.max(0, S.ui.ob.step - 1); },
    "ob-area"(){ const a = S.ui.ob.a.areas; const i = a.indexOf(v); if (i >= 0) a.splice(i,1); else if (a.length < 4) a.push(v); else toast("Pick up to four."); },
    "ob-obs"(){ S.ui.ob.a.obstacle = v; },
    "ob-int"(){ S.ui.ob.a.intensity = v; },
    "ob-hard"(){ S.ui.ob.a.hard = !S.ui.ob.a.hard; },
    "ob-rest"(){ const r = S.ui.ob.a.rest, n = Number(v); S.ui.ob.a.rest = r.includes(n) ? r.filter(x => x !== n) : [...r, n].slice(-3); },
    "ob-task"(){ const t = S.ui.ob.result.tasks[Number(v)]; t.off = !t.off; },
    "ob-finish"(){ finishOnboarding(); return true; },
  };
  if (A[act]) { const skip = A[act](); if (!skip) render(); }
});
function readEdit(){
  const d = S.ui.sheet && S.ui.sheet.draft; if (!d) return;
  const g = id => document.getElementById(id);
  if (g("e-title")) { d.title = g("e-title").value; d.target = g("e-target").value; d.unit = g("e-unit").value; d.remind = g("e-remind").value; }
}
function readWo(){
  document.querySelectorAll("[data-wo]").forEach(inp => { const m = S.ui.wo.moves[Number(inp.dataset.m)]; if (!m) return; if (inp.dataset.wo === "name") m.name = inp.value; else m.sets[Number(inp.dataset.s)][inp.dataset.wo] = inp.value; });
}
function readOb(){ const n = document.getElementById("ob-name"); if (n) S.ui.ob.a.name = n.value.trim(); }
function logFood(x, noSave){
  const item = {id: uid(), date: todayKey(), ts: Date.now(), name: x.name, kcal: x.kcal, protein: x.protein || 0, carbs: x.carbs || 0, fat: x.fat || 0, portion: x.portion || ""};
  S.fit.foods.push(item);
  const cutoff = addDays(todayKey(), -60); S.fit.foods = S.fit.foods.filter(f => f.date >= cutoff);
  S.fit.recent = [{name: x.name, kcal: x.kcal, protein: x.protein || 0, carbs: x.carbs || 0, fat: x.fat || 0}, ...S.fit.recent.filter(r => r.name !== x.name)].slice(0, 12);
  // protein / water quests that use grams
  const k = todayKey(), pSum = S.fit.foods.filter(f => f.date === k).reduce((a,f) => a + f.protein, 0);
  for (const t of scheduled(k)) if (/protein/i.test(t.title) && t.unit === "g") setProgress(k, t, pSum);
  if (!noSave) { save("fit"); toast(`${x.name} logged.`); }
}
async function exportData(){
  const data = JSON.stringify({app: "arc66", exportedAt: new Date().toISOString(), state: S.state, journal: S.journal, fit: S.fit, books: S.books}, null, 2);
  const name = `arc66-backup-${todayKey()}.json`;
  const file = new File([data], name, {type: "application/json"});
  try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: "Arc 66 backup"}); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.ob && el.type === "range") { S.ui.ob.a[el.dataset.ob] = Number(el.value); const o = document.getElementById(`ob-${el.dataset.ob}-v`); if (o) o.textContent = el.value + (el.dataset.unit || ""); }
  if (el.id === "fsearch") { S.ui.fq = el.value; const r = document.getElementById("fresults"); if (r) r.innerHTML = foodResults(el.value); }
  if (el.id === "jtext") { S.ui.jDraft = {mood: (S.ui.jDraft && S.ui.jDraft.mood) || 3, text: el.value}; }
  if (el.dataset.wo && S.ui.wo) { readWo(); lsSet("arc66.wo", S.ui.wo); }
});
document.addEventListener("change", async e => {
  const el = e.target, act = el.dataset.actChange; if (!act) return;
  const s = S.state;
  if (act === "name") { s.name = el.value.trim(); save("state"); }
  if (act === "units") { s.units = el.value; save("state"); }
  if (act === "bedtime") { s.bedtime = el.value || null; save("state"); toast(el.value ? `Bedtime set to ${el.value}.` : "Bedtime countdown off."); }
  if (act === "kgoal") { S.fit.kcalGoal = Math.max(800, Number(el.value) || 2200); save("fit"); render(); }
  if (act === "pgoal") { S.fit.proteinGoal = Math.max(10, Number(el.value) || 120); save("fit"); }
  if (act === "e-lib") { const [a, i] = el.value.split(":"); if (a) { const x = LIB[a][Number(i)]; Object.assign(S.ui.sheet.draft, {title: x.title, stat: x.stat, diff: x.diff, target: x.target, unit: x.unit, days: x.days || [0,1,2,3,4,5,6]}); render(); } }
  if (act === "import") {
    const f = el.files && el.files[0]; el.value = ""; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (d.app !== "arc66" || !d.state || !Array.isArray(d.state.tasks)) throw 0;
      S.state = d.state; S.journal = d.journal || {entries: []}; S.fit = d.fit || S.fit; S.books = d.books || {items: [], log: {}};
      for (const n of Object.keys(DOCS)) save(n); toast("Backup restored."); render();
    } catch { toast("That file isn't an Arc 66 backup."); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.ui.sheet) { S.ui.sheet = null; render(); } });

/* ---------- boot ---------- */
loadLocal();
S.ui.wo = lsGet("arc66.wo");
if (S.timer && S.timer.endAt < Date.now() - 6*3600e3) { S.timer = null; lsDel("arc66.timer"); }
if (S.timer && S.timer.kind === "phone") { S.timer = null; lsDel("arc66.timer"); }
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
